---
name: prek checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mise_version:
        description: Override mise-action version option.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prek-checks:
    name: Prek Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Cleaning up"
        uses: gacts/run-and-post-run@fc6503862aba998e2f2123225ad63c09a92ed46e # v1.4.5
        with:
          run: |
            echo "Pre-Check Cleanup"
            echo "~/.local" | xargs rm -rf
          post: |
            echo "Post-Check Cleanup"
            echo "~/.local" | xargs rm -rf

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # uv/pipx backend tools break when restored from the mise cache (jdx/mise#13984)
          cache: false
          version: ${{ inputs.mise_version || vars.MISE_VERSION }}

      - name: Run prek checks
        run: prek run --all-files --show-diff-on-failure
